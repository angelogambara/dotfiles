# Strongly prefer keeping process memory in physical RAM over swapping to disk (default is 60)
vm.swappiness = 10

# Lower kernel aggressiveness in reclaiming directory/inode caches to keep VFS metadata in RAM longer (default is 100)
vm.vfs_cache_pressure = 50

# Set default queuing discipline to Fair Queueing (FQ), required for optimal BBR performance and bufferbloat reduction
net.core.default_qdisc = fq

# Enable Google's BBR TCP congestion control algorithm for higher throughput and lower latency
net.ipv4.tcp_congestion_control = bbr

# Enable TCP Fast Open (TFO) bitmask: 1 = client-side, 2 = server-side, 3 = both enabled simultaneously
net.ipv4.tcp_fastopen = 3

# Max memory map areas a process can hold; elevated to support high-concurrency apps (e.g., Elasticsearch, Redis, databases)
vm.max_map_count = 1048576

# Set maximum number of open file handles system-wide to handle heavy concurrent socket and file workloads
fs.file-max = 2097152
